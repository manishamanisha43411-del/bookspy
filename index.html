<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booksky - Book Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="booksky-header">
        <h1>BookSky</h1>
    </div>

    <div class="container">
        <div class="book-container">
            <h2 >The Silent Horizon</h2>
            <h5>Arjun Mehta</h5>
            <p>A young traveler discovers an unknown village hidden beyond
                the mountains. As he explores its secrets, he learns
                about courage, friendship, and the importance
                of following his dreams.
            </p>
            <button class="button" onclick="deletebook(event)">Delete</button>
        </div>
    </div>

    <div class="popup-overlay"></div>
    <div class="popup-box">
        <h2>Add Book</h2>
        <form>
            <input type="text" placeholder="book title" id="book-title-input">
            <input type="text" placeholder="book-author" id="book-author-input">
            <textarea placeholder="short description" id="book-description-input"></textarea>
        </form>
        <button id="add-book">Add</button>
        <button id="add-popup">Cancel</button>
    </div>

    <button class="add-button" id="add-popup-button">+</button>

















    <script src="script.js"></script>

</body>

</html>
